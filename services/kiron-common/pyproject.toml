[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiron-common"
version = "0.1.0"
description = "Shared Kiron compatibility helpers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kiron_common*"]
